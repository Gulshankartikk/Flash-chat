<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF7849" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110F" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Flash Chat - Blazing-fast realtime messaging, voice/video calling, social feed, encrypted pocket vault, and Flash AI assistant." />
    <title>Flash Chat - Realtime Messaging, Social & AI Assistant</title>
    <!-- Immediate theme bootstrap to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('flash_chat_theme');
          var isDark = saved ? saved === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var activeTheme = isDark ? 'dark' : 'light';
          document.documentElement.classList.add(activeTheme);
          document.documentElement.classList.remove(isDark ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', activeTheme);
          document.documentElement.style.colorScheme = activeTheme;
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts Inter & Instrument Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Google Identity Services for Authorize with Google -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-cream text-ink dark:bg-card dark:text-ink antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
