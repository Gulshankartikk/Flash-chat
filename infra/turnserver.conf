# ==============================================================================
# Coturn TURN/STUN Server Configuration for Flash Chat
# ==============================================================================

# Listening port for STUN/TURN UDP and TCP
listening-port=3478
tls-listening-port=5349

# Min and max relay UDP ports
min-port=49160
max-port=49200

# Server realm and identity
realm=flashchat.local
server-name=flashchat-coturn

# Enable long-term credential mechanism
lt-cred-mech

# Static credentials for local testing
user=flashchat:flashchatpassword123

# Time-limited credentials secret (matches TURN_SECRET in .env)
static-auth-secret=flashchat_coturn_static_auth_secret_2026

# Fingerprint in TURN messages
fingerprint

# Verbose logging
verbose

# Do not allow loopback addresses for relaying
no-loopback-peers
no-multicast-peers
