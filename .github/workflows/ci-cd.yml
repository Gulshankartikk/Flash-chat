name: Flash Chat CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Root Dependencies
      run: npm install

    - name: Install Server Dependencies
      run: |
        cd server
        npm install

    - name: Run Server Lint Checks
      run: |
        cd server
        npm run lint

    - name: Install Client Dependencies
      run: |
        cd client
        npm install

    - name: Build Client (Vite)
      run: |
        cd client
        npm run build
