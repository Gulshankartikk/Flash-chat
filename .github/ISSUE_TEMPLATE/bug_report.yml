name: Bug Report
description: Report a reproducible defect or unexpected error in Flash Chat
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### ⚠️ Security Warning
        **Never post passwords, API keys, private tokens, personal phone numbers, or confidential messages in public issues.**
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Detailed summary of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Browser, OS version, and Flash Chat app version (from Settings > About).
    validations:
      required: true
