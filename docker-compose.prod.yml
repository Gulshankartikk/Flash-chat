version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: flash-chat-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword123}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_prod_data:/data
    networks:
      - flash_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  mongo:
    image: mongo:7.0
    container_name: flash-chat-db-prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-flashadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-flashsecurepass123}
      MONGO_INITDB_DATABASE: flashchat
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - flash_internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    container_name: flash-chat-server-prod
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://flashadmin:flashsecurepass123@mongo:27017/flashchat?authSource=admin}
      - REDIS_URL=${REDIS_URL:-redis://:redispassword123@redis:6379}
      - CLIENT_URL=${CLIENT_URL:-https://flashchat.app}
    env_file:
      - ./server/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flash_internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {if (r.statusCode !== 200) process.exit(1);})"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    container_name: flash-chat-client-prod
    restart: unless-stopped
    networks:
      - flash_internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: flash-chat-proxy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
    networks:
      - flash_internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  coturn:
    image: coturn/coturn:latest
    container_name: flash-chat-turn-prod
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
    networks:
      - flash_internal

networks:
  flash_internal:
    driver: bridge

volumes:
  mongo_prod_data:
    driver: local
  redis_prod_data:
    driver: local
